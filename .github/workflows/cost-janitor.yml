name: Cost Janitor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cost-janitor:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,s3,iam,sts

    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r janitor/requirements.txt

      - name: Set up Terraform 1.7
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Install tflocal
        run: pip install terraform-local

      - name: Wait for LocalStack EC2 to be ready
        run: |
          echo "Waiting for LocalStack..."
          for i in $(seq 1 40); do
            STATUS=$(curl -sf http://localhost:4566/_localstack/health 2>/dev/null || echo "{}")
            echo "$STATUS" | grep -q '"ec2"' && echo "LocalStack ready." && break
            echo "  attempt $i/40..."
            sleep 3
          done

      - name: terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: tflocal init -input=false

      - name: terraform validate
        working-directory: terraform
        run: tflocal validate

      - name: Terraform apply (LocalStack)
        working-directory: terraform
        run: tflocal apply -auto-approve -input=false

      - name: Run unit tests
        working-directory: janitor
        run: pytest tests/ -v

      - name: Run Cost Janitor (dry-run)
        id: janitor
        working-directory: janitor
        run: |
          python janitor.py \
            --dry-run \
            --endpoint-url http://localhost:4566 \
            --output-dir ../reports
        continue-on-error: true

      - name: Upload cost report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cost-janitor-report
          path: reports/
          if-no-files-found: warn

      - name: Post orphan summary as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const jsonPath = 'reports/report.json';
            const mdPath   = 'reports/report.md';

            if (!fs.existsSync(jsonPath)) {
              console.log('No report.json found — skipping comment.');
              return;
            }

            const report  = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
            const orphans = report.summary.total_orphans;

            if (orphans === 0) {
              console.log('No orphans found — skipping PR comment.');
              return;
            }

            const body = fs.existsSync(mdPath)
              ? `## :broom: Cost Janitor found ${orphans} orphaned resource(s)\n\n` +
                fs.readFileSync(mdPath, 'utf8')
              : `## Cost Janitor: ${orphans} orphan(s) found. See attached artifact for details.`;

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
